<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="menu">
            <h1>PONG</h1>
            <div class="menu-options">
                <button id="1v1-btn">1 vs 1</button>
                <button id="1vai-btn">1 vs AI</button>
                <button id="aivai-btn">AI vs AI</button>
                <div class="difficulty-container hidden" id="difficulty-container">
                    <h3>Select Difficulty:</h3>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                        <option value="impossible">Impossible</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="game-over" class="hidden">
            <h2 id="winner-text">Player 1 Wins!</h2>
            <div id="final-score"></div>
            <button id="menu-btn">Back to Menu</button>
            <button id="rematch-btn">Rematch</button>
        </div>
        <div id="score" class="hidden">
            <div id="player1-score">0</div>
            <div id="player2-score">0</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
