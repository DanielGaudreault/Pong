<!DOCTYPE html>
<html>
<head>
    <title>Neon Pong</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        :root {
            --neon-blue: #0ff0fc;
            --neon-pink: #ff2a6d;
            --neon-purple: #d300c5;
            --dark-bg: #0d0221;
            --glow: 0 0 10px, 0 0 20px;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--dark-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Orbitron', sans-serif;
            color: white;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
        }
        
        #menu {
            text-align: center;
            z-index: 10;
            animation: pulse 2s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }
        
        #menu h1 {
            font-size: 4em;
            margin-bottom: 30px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue), 
                         0 0 20px var(--neon-blue);
            letter-spacing: 3px;
        }
        
        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: transparent;
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--neon-pink);
        }
        
        button:hover {
            background: var(--neon-pink);
            color: var(--dark-bg);
            transform: translateY(-3px);
            box-shadow: 0 0 20px var(--neon-pink);
        }
        
        .settings {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        
        .settings label {
            display: block;
            margin-bottom: 15px;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }
        
        select {
            padding: 8px 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid var(--neon-purple);
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
        }
        
        select:focus {
            outline: none;
            box-shadow: 0 0 10px var(--neon-purple);
        }
        
        canvas {
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            display: none;
        }
        
        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13,2,33,0.9);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        
        #game-over h2 {
            font-size: 3em;
            color: var(--neon-pink);
            text-shadow: var(--glow) var(--neon-pink);
            margin-bottom: 40px;
            animation: blink 1s infinite alternate;
        }
        
        @keyframes blink {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            width: 100%;
            display: none;
            justify-content: space-around;
            font-size: 2em;
            text-shadow: var(--glow) white;
        }
        
        #left-score {
            color: var(--neon-blue);
        }
        
        #right-score {
            color: var(--neon-pink);
        }
        
        .particle {
            position: absolute;
            background: var(--neon-purple);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="menu">
            <h1>NEON PONG</h1>
            <div class="menu-options">
                <button id="btn-1v1">1 vs 1</button>
                <button id="btn-1vai">1 vs AI</button>
            </div>
            <div class="settings">
                <label>
                    Difficulty:
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </label>
                <label>
                    Score to Win:
                    <select id="score-cap">
                        <option value="5">5</option>
                        <option value="7" selected>7</option>
                        <option value="10">10</option>
                    </select>
                </label>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div id="score-display">
            <span id="left-score">0</span>
            <span id="right-score">0</span>
        </div>
        
        <div id="game-over">
            <h2 id="winner-text">Player 1 Wins!</h2>
            <button id="btn-menu">Back to Menu</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game elements
        const paddleHeight = 100;
        const paddleWidth = 15;
        const ballSize = 15;
        
        // Game state
        let leftPaddleY = canvas.height/2 - paddleHeight/2;
        let rightPaddleY = canvas.height/2 - paddleHeight/2;
        let ballX = canvas.width/2;
        let ballY = canvas.height/2;
        let ballSpeedX = 5;
        let ballSpeedY = 5;
        let leftScore = 0;
        let rightScore = 0;
        let gameRunning = false;
        let gameMode = '1v1';
        let difficulty = 'medium';
        let scoreCap = 7;
        let animationId = null;
        
        // DOM elements
        const menu = document.getElementById('menu');
        const scoreDisplay = document.getElementById('score-display');
        const leftScoreDisplay = document.getElementById('left-score');
        const rightScoreDisplay = document.getElementById('right-score');
        const gameOverScreen = document.getElementById('game-over');
        const winnerText = document.getElementById('winner-text');
        
        // Control flags
        let wPressed = false;
        let sPressed = false;
        let upPressed = false;
        let downPressed = false;
        
        // Create particles for effects
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = color;
                particle.style.opacity = Math.random() * 0.5 + 0.5;
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 5 + 2;
                const xVel = Math.cos(angle) * velocity;
                const yVel = Math.sin(angle) * velocity;
                
                document.body.appendChild(particle);
                
                let posX = x;
                let posY = y;
                let opacity = 1;
                
                const animate = () => {
                    posX += xVel;
                    posY += yVel;
                    opacity -= 0.02;
                    
                    particle.style.left = posX + 'px';
                    particle.style.top = posY + 'px';
                    particle.style.opacity = opacity;
                    
                    if (opacity > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        particle.remove();
                    }
                };
                
                animate();
            }
        }
        
        // Initialize game
        function init() {
            // Set up event listeners
            document.getElementById('btn-1v1').addEventListener('click', () => {
                gameMode = '1v1';
                startGame();
            });
            
            document.getElementById('btn-1vai').addEventListener('click', () => {
                gameMode = '1vai';
                startGame();
            });
            
            document.getElementById('btn-menu').addEventListener('click', returnToMenu);
            
            document.getElementById('difficulty').addEventListener('change', (e) => {
                difficulty = e.target.value;
            });
            
            document.getElementById('score-cap').addEventListener('change', (e) => {
                scoreCap = parseInt(e.target.value);
            });
            
            // Keyboard controls
            document.addEventListener('keydown', function(e) {
                if(!gameRunning) return;
                
                if(e.key === 'w') wPressed = true;
                if(e.key === 's') sPressed = true;
                if(e.key === 'ArrowUp') upPressed = true;
                if(e.key === 'ArrowDown') downPressed = true;
                
                // Pause game with Escape
                if(e.key === 'Escape') {
                    togglePause();
                }
            });
            
            document.addEventListener('keyup', function(e) {
                if(!gameRunning) return;
                
                if(e.key === 'w') wPressed = false;
                if(e.key === 's') sPressed = false;
                if(e.key === 'ArrowUp') upPressed = false;
                if(e.key === 'ArrowDown') downPressed = false;
            });
        }
        
        function startGame() {
            // Reset scores
            leftScore = 0;
            rightScore = 0;
            updateScoreDisplay();
            
            // Reset positions
            leftPaddleY = canvas.height/2 - paddleHeight/2;
            rightPaddleY = canvas.height/2 - paddleHeight/2;
            resetBall();
            
            // Show game elements
            menu.style.display = 'none';
            canvas.style.display = 'block';
            scoreDisplay.style.display = 'flex';
            gameOverScreen.style.display = 'none';
            
            // Start game loop
            gameRunning = true;
            if(animationId) {
                cancelAnimationFrame(animationId);
            }
            gameLoop();
        }
        
        function returnToMenu() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            animationId = null;
            
            menu.style.display = 'block';
            canvas.style.display = 'none';
            scoreDisplay.style.display = 'none';
            gameOverScreen.style.display = 'none';
        }
        
        function togglePause() {
            if(!gameRunning) return;
            
            gameRunning = !gameRunning;
            if(gameRunning) {
                gameLoop();
            } else {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }
        
        function resetBall() {
            ballX = canvas.width/2;
            ballY = canvas.height/2;
            ballSpeedX = 5 * (Math.random() > 0.5 ? 1 : -1);
            ballSpeedY = 5 * (Math.random() > 0.5 ? 1 : -1);
        }
        
        function updateScoreDisplay() {
            leftScoreDisplay.textContent = leftScore;
            rightScoreDisplay.textContent = rightScore;
        }
        
        function moveAI() {
            // AI difficulty settings
            let reactionSpeed;
            switch(difficulty) {
                case 'easy': reactionSpeed = 0.6; break;
                case 'medium': reactionSpeed = 0.8; break;
                case 'hard': reactionSpeed = 0.95; break;
                default: reactionSpeed = 0.8;
            }
            
            // Predict ball position
            const paddleCenter = rightPaddleY + paddleHeight/2;
            const ballFutureY = ballY + (ballSpeedY * (canvas.width - ballX) / ballSpeedX);
            
            // Move paddle toward predicted position
            if(paddleCenter < ballFutureY - 10) {
                rightPaddleY += 6 * reactionSpeed;
            } else if(paddleCenter > ballFutureY + 10) {
                rightPaddleY -= 6 * reactionSpeed;
            }
            
            // Keep paddle on screen
            if(rightPaddleY < 0) rightPaddleY = 0;
            if(rightPaddleY > canvas.height - paddleHeight) rightPaddleY = canvas.height - paddleHeight;
        }
        
        function checkGameOver() {
            if(leftScore >= scoreCap || rightScore >= scoreCap) {
                gameRunning = false;
                cancelAnimationFrame(animationId);
                
                if(leftScore >= scoreCap) {
                    winnerText.textContent = gameMode === '1vai' ? 'YOU WIN!' : 'PLAYER 1 WINS!';
                } else {
                    winnerText.textContent = gameMode === '1vai' ? 'AI WINS!' : 'PLAYER 2 WINS!';
                }
                
                gameOverScreen.style.display = 'flex';
                createParticles(canvas.width/2, canvas.height/2, '#ff2a6d');
            }
        }
        
        function drawPaddle(x, y, color) {
            const gradient = ctx.createLinearGradient(x, y, x, y + paddleHeight);
            gradient.addColorStop(0, 'rgba(255,255,255,0.1)');
            gradient.addColorStop(0.5, color);
            gradient.addColorStop(1, 'rgba(255,255,255,0.1)');
            
            ctx.shadowColor = color;
            ctx.shadowBlur = 20;
            ctx.fillStyle = gradient;
            ctx.fillRect(x, y, paddleWidth, paddleHeight);
            ctx.shadowBlur = 0;
            
            // Paddle border
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, paddleWidth, paddleHeight);
        }
        
        function drawBall() {
            const gradient = ctx.createRadialGradient(
                ballX + ballSize/2, ballY + ballSize/2, 0,
                ballX + ballSize/2, ballY + ballSize/2, ballSize*2
            );
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#0ff0fc');
            
            ctx.shadowColor = '#0ff0fc';
            ctx.shadowBlur = 20;
            ctx.fillStyle = gradient;
            ctx.fillRect(ballX, ballY, ballSize, ballSize);
            ctx.shadowBlur = 0;
        }
        
        function drawCenterLine() {
            ctx.beginPath();
            ctx.setLineDash([15, 15]);
            ctx.moveTo(canvas.width/2, 0);
            ctx.lineTo(canvas.width/2, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        function gameLoop() {
            // Clear canvas with gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0d0221');
            gradient.addColorStop(1, '#1a0435');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Move paddles
            if(wPressed && leftPaddleY > 0) leftPaddleY -= 8;
            if(sPressed && leftPaddleY < canvas.height - paddleHeight) leftPaddleY += 8;
            
            if(gameMode === '1v1') {
                if(upPressed && rightPaddleY > 0) rightPaddleY -= 8;
                if(downPressed && rightPaddleY < canvas.height - paddleHeight) rightPaddleY += 8;
            } else {
                moveAI();
            }
            
            // Move ball
            ballX += ballSpeedX;
            ballY += ballSpeedY;
            
            // Ball collision with top/bottom
            if(ballY <= 0 || ballY >= canvas.height - ballSize) {
                ballSpeedY = -ballSpeedY;
                createParticles(ballX, ballY, '#d300c5');
            }
            
            // Ball collision with paddles
            if(ballX <= paddleWidth && 
               ballY + ballSize >= leftPaddleY && 
               ballY <= leftPaddleY + paddleHeight) {
                ballSpeedX = -ballSpeedX * 1.05;
                createParticles(ballX, ballY + ballSize/2, '#0ff0fc');
            }
            
            if(ballX >= canvas.width - paddleWidth - ballSize && 
               ballY + ballSize >= rightPaddleY && 
               ballY <= rightPaddleY + paddleHeight) {
                ballSpeedX = -ballSpeedX * 1.05;
                createParticles(ballX, ballY + ballSize/2, '#ff2a6d');
            }
            
            // Ball out of bounds (scoring)
            if(ballX < 0) {
                rightScore++;
                updateScoreDisplay();
                resetBall();
                checkGameOver();
            }
            if(ballX > canvas.width) {
                leftScore++;
                updateScoreDisplay();
                resetBall();
                checkGameOver();
            }
            
            // Draw game elements
            drawCenterLine();
            drawPaddle(0, leftPaddleY, '#0ff0fc');
            drawPaddle(canvas.width - paddleWidth, rightPaddleY, '#ff2a6d');
            drawBall();
            
            // Continue game loop
            if(gameRunning) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }
        
        // Start the game when loaded
        window.addEventListener('load', init);
    </script>
</body>
</html>
